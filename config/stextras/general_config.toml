#This enables proxy support don't turn this on unless you are a server owner and know what your doing
NetworkMode = false
#If true, dedicated servers require clients to report the same STExtras version before joining.
versionControl = true
#How long the server waits for a client-initiated version reply before disconnecting them, in milliseconds.
versionCheckTimeOut = 30000
#Command for configurable key 1.
#Leave empty to disable.
#
#Executor types:
#c: = Execute with server console permissions
#p: = Execute with the player's permissions
#
#Available variables:
#{p} = Player name
#{uuid} = Player UUID
#
#Example:
#c:/gamemode creative {p}
#
keyOneCommand = ""
#Command for configurable key 2.
#Leave empty to disable.
#
#Executor types:
#c: = Execute with server console permissions
#p: = Execute with the player's permissions
#
#Available variables:
#{p} = Player name
#{uuid} = Player UUID
#
keyTwoCommand = ""
#Command for configurable key 3.
#Leave empty to disable.
#
#Executor types:
#c: = Execute with server console permissions
#p: = Execute with the player's permissions
#
#Available variables:
#{p} = Player name
#{uuid} = Player UUID
#
keyThreeCommand = ""
